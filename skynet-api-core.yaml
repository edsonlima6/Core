apiVersion: apps/v1
kind: Deployment
metadata:
  name: skynet-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skynet-api
  template:
    metadata:
      labels:
        app: skynet-api
    spec:
      containers:
        - name: skynet-api
          image: skynetapicore:v0.0.999
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: skynet-api
spec:
  type: LoadBalancer
  selector:
    app: skynet-api
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8080