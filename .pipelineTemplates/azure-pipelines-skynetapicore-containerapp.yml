# Builds SkyNetApiCore, pushes the image to ACR, and updates the Azure Container App.

trigger:
  branches:
    include:
      - master
  paths:
    include:
      - Application/**
      - Domain/**
      - Infra.IoC/**
      - InfraCoreDapper/**
      - InfraCoreEF/**
      - SkyNetApiCore/**
      - Directory.Packages.props
      - Core.sln
      - .agents/skills/skynetapicore-docker/VERSION
      - .pipelineTemplates/azure-pipelines-skynetapicore-containerapp.yml
      - .pipelineTemplates/skynetapicore-containerapp-steps.yml

pr: none

pool:
  name: Default

parameters:
  - name: imageVersion
    displayName: Image version without leading v. Leave blank to use .agents/skills/skynetapicore-docker/VERSION.
    type: string
    default: ''
  - name: environmentTag
    displayName: Image environment tag prefix.
    type: string
    default: dev
    values:
      - dev
      - test
      - prod
  - name: deployContainerApp
    displayName: Deploy image to Azure Container App.
    type: boolean
    default: true

variables:
  buildConfiguration: Release

  # Azure DevOps service connection with access to the Pay-As-You-Go subscription.
  azureServiceConnection: Pay-As-You-Go

  acrName: skynetapibart
  acrLoginServer: skynetapibart.azurecr.io
  acrRepository: skynetapibart

  resourceGroupName: grp-warehouse-product-dev
  containerAppName: skynetapicore

  dockerfilePath: SkyNetApiCore/Dockerfile
  localImageName: skynetapicore

stages:
  - stage: BuildPushAndDeploy
    displayName: Build, push, and deploy SkyNetApiCore
    jobs:
      - job: BuildPushAndDeploy
        displayName: Build image, push to ACR, update Container App
        timeoutInMinutes: 150
        steps:
          - checkout: self
            clean: true

          - template: skynetapicore-containerapp-steps.yml
            parameters:
              imageVersion: ${{ parameters.imageVersion }}
              environmentTag: ${{ parameters.environmentTag }}
              deployContainerApp: ${{ parameters.deployContainerApp }}
              buildConfiguration: $(buildConfiguration)
              azureServiceConnection: $(azureServiceConnection)
              acrName: $(acrName)
              acrLoginServer: $(acrLoginServer)
              acrRepository: $(acrRepository)
              resourceGroupName: $(resourceGroupName)
              containerAppName: $(containerAppName)
              dockerfilePath: $(dockerfilePath)
              localImageName: $(localImageName)
